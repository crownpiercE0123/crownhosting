<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>វេបសាយរបស់ខ្ញុំ</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
    header { background: #2c7be5; color: white; text-align: center; padding: 40px 20px; }
    main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .button { display: inline-block; background: #2c7be5; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
    footer { text-align: center; padding: 20px; background: #222; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>សូមស្វាគមន៍មកកាន់វេបសាយរបស់ខ្ញុំ</h1>
    <p>ការណែនាំខ្លីអំពីអ្វីដែលអ្នកធ្វើ</p>
  </header>

  <main>
    <div class="card">
      <h2>អំពីខ្ញុំ</h2>
      <p>សរសេរប្រយោគពីរបីអំពីខ្លួនអ្នក ឬគម្រោងរបស់អ្នកនៅទីនេះ។</p>
    </div>

    <div class="card">
      <h2>ទំនាក់ទំនង</h2>
      <p>អ៊ីមែល: you@example.com</p>
      <a class="button" href="mailto:you@example.com">ផ្ញើអ៊ីមែល</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 វេបសាយរបស់ខ្ញុំ</p>
  </footer>
</body>
</html>
